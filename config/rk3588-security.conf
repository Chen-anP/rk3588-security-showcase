# rk3588-security 配置文件
# 格式：[分区] 下写“键 = 值”；注释单独成行，以 # 开头。
# 修改后先检查再重启：rk3588-security --config 本文件 --check-config

[camera]
# 上板前将示例路径换成实际 /dev/v4l/by-id/ 路径
device = /dev/v4l/by-id/usb-REPLACE_WITH_CAMERA-video-index0
width = 1280
height = 720
# 请求的帧率；实际帧率随光线在 10～30 之间变化（D03）
fps = 30
# 防闪烁：50（中国电网）/ 60 / 0 关闭
power_line_hz = 50
# 驱动缓冲区个数（2～16）。处理线程拿着帧不放时，驱动只能往剩下的缓冲区里写
buffers = 4

[display]
# 显示设备：auto = 按驱动名找 rockchip 显示设备（card 编号可能随内核变化，不要写死）
device = auto
# 输出口：auto = 第一个连了屏幕的；也可以写 HDMI-A-1
# 分辨率和时序不在这里配：由启动参数 video= 决定（provision.sh 设置，见 D14），程序沿用内核当前模式
connector = auto
# 触摸屏：用固定路径（和摄像头一样，eventN 编号会变）；不用触摸就留空
touch = /dev/input/by-id/usb-REPLACE_WITH_TOUCH-event-if00

[detect]
# 人员检测（NPU）。false = 只显示预览，不检测
enabled = true
# 模型文件的绝对路径。模型不进 git，来源和 sha256 登记在 models/MODELS.md；
# 将模型放到部署目录，或调整模型路径
model = /usr/share/rk3588-security/models/yolo11n_640_i8_rk3588_tk232.rknn
# 同时推理的 NPU 上下文个数 1～3，每个绑一个 NPU 核。
# 第 6 步实测：yolo11n 推理 + 后处理约 23 ms，1 个就跟得上 25～30 fps；2、3 个吞吐量够用但延迟不变、
# 3 个时内存多约 14 MB（RSS 34 → 48 MB）。换更大的模型或更高帧率、检测跟不上（--detect-run 里“跳过”变多）时再加
workers = 1
# 分数低于这个的框不要（0.05～0.95）；同类两个框重叠超过 nms_threshold 去掉分数低的（0.1～0.9）
score_threshold = 0.25
nms_threshold = 0.45
# 要检测的类别（COCO 英文名，逗号分隔）。门禁只关心人
classes = person

[face]
# 人脸检测模型（RetinaFace，第 7b 步）。来源和 sha256 登记在 models/MODELS.md
detect_model = /usr/share/rk3588-security/models/retinaface_mobile320_i8_rk3588_tk232.rknn
# 人脸概率低于这个的不要（0.1～0.99）
detect_threshold = 0.5
# 人脸识别（第 7c 步）：true / false
recognize = true
# 识别模型（insightface MobileFaceNet，只允许非商业研究使用，见 models/MODELS.md）
recognize_model = /usr/share/rk3588-security/models/mobilefacenet_112_fp16_rk3588_tk232.rknn
# 和底库里的人相似度达到多少算认出来（0.1～0.95，按第 7c 步的实测校准）
match_threshold = 0.5
# 人脸库（第 7d 步）：rk3588-security --enroll 名字 登记，--faces 查看，--unenroll 名字 删除
# 第 11 步打包后放到 /var/lib/rk3588-security/faces.db
database = /var/lib/rk3588-security/faces.db

[encode]
# 视频编码（第 8a 步，MPP 硬件 H.264）：给事件录像和 RTSP 实时流用。false = 不编码
enabled = true
# 目标码率（kbps，CBR 固定码率）。720p 25 fps 的室内场景 2000～4000 够用；码率越高越清楚、磁盘和网络占用越大
bitrate_kbps = 4000
# 码率控制按这个帧率算每帧的预算（5～60）；摄像头实际帧率随光线变化，这里不是限制
fps = 25
# 每隔多少帧一个关键帧（5～300）。50 帧约 2 秒：录像最多多等 2 秒才能开始，RTSP 新客户端最多等 2 秒出画面
gop = 50

[record]
# 事件录像（第 8b 步）：陌生人出现时录一段 MP4，记进事件表（和人脸库同一个数据库文件）。
# 要 encode.enabled 和 face.recognize 都是 true 才会录。false = 不录
enabled = true
# 录像目录（绝对路径；程序把权限设成 0700，文件 0600）。第 11 步打包后放到 /var/lib/rk3588-security/events
dir = /var/lib/rk3588-security/events
# 预录：陌生人出现前多少秒（1～30）。录像必须从关键帧开始，实际会多 0～1 个关键帧间隔（约 2 秒）
pre_seconds = 5
# 陌生人消失多久后结束（1～120）：中间短暂被挡住不会切成两段
post_seconds = 10
# 一个文件最长多少秒（30～3600），超过切成下一个文件
max_seconds = 300
# 录像总大小上限（MB，64～1000000），超过从最旧的删。4 Mbps 约每分钟 30 MB
quota_mb = 2048

[rtsp]
# RTSP 实时流（第 8c 步）：VLC 打开 rtsp://板子IP:8554/live，输入账号密码。要 encode.enabled = true
enabled = true
# 监听地址：0.0.0.0 = 所有网卡；只给本机看写 127.0.0.1
address = 0.0.0.0
port = 8554
path = /live
# 账号文件（不进 git）：一行“用户名:密码”，密码至少 8 位，文件权限必须是 600。没有这个文件就不开 RTSP。
# 建法：mkdir -p ~/.config/rk3588-security && (umask 077; echo "viewer:换成你的密码" > ~/.config/rk3588-security/rtsp_credentials)
# 第 11 步打包后放到 /etc/rk3588-security/rtsp_credentials
credentials = /etc/rk3588-security/rtsp_credentials

[log]
# debug / info / warn / error
level = info
